spring.application.name=iphonefixit

# =========================
# Server
# =========================
server.port=${PORT:8080}
server.address=0.0.0.0


# =========================
# MySQL Database
# Local defaults + Aiven environment variables
# =========================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:iphonefixit}?sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}


# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# =========================
# Frontend / Backend URLs
# =========================
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.backend-url=${BACKEND_URL:http://localhost:8080}


# =========================
# JWT
# =========================
app.jwt.secret=${JWT_SECRET:iphonefixit-super-secret-jwt-key-2026-change-this}
app.jwt.expiration=86400000


# =========================
# Initial Admin
# =========================
app.admin.name=${ADMIN_NAME:iPhoneFixit Admin}
app.admin.email=${ADMIN_EMAIL:admin@iphonefixit.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}


# =========================
# Phone Image Upload
# =========================
file.upload-dir=${UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB